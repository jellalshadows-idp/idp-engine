name: idp-pr

# Reusable PR pipeline (spec §6.1): validate and render, diff against wet, plan
# the affected stacks, keep one sticky plan comment, and end in a verdict that
# the caller's idp-gate job mirrors (ADR-0022).
# The plan job plans the github stack with the reader App; it does not refresh:
# it compares the claims with the state the last apply wrote, because the
# read-only reader token cannot see admin-only repository fields (ADR-0025).
# Each affected AWS stack is planned in a plan-aws job against a floci of its
# own, which holds no secret (ADR-0031). Only reduced plans, addresses and
# actions, cross jobs; the comment job summarizes them. What a job without
# floci uploads is downloaded by artifact ID; only the AWS plans, which floci
# jobs upload, are downloaded by pattern, into a directory apart from the github plan's.

on:
  workflow_call:
    secrets:
      IDP_READER_PRIVATE_KEY:
        description: The reader App's private key (repo secret).
        required: false
      IDP_STATE_PASSPHRASE:
        description: The OpenTofu state passphrase (repo secret).
        required: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .idp/engine
          persist-credentials: false
      - uses: ./.idp/engine/.github/actions/setup-idp # zizmor: ignore[self-repository] the engine is checked out at job.workflow_sha in the step above (ADR-0021)
        with:
          engine-dir: .idp/engine
          version: ${{ job.workflow_sha }}
      - name: validate the claims
        run: idp validate
      - name: render the claims
        run: idp render --out "$RUNNER_TEMP/idp/rendered"

  plan:
    name: plan
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      affected: ${{ steps.diff.outputs.affected }}
      aws: ${{ steps.stacks.outputs.aws }}
      renders-id: ${{ steps.upload-renders.outputs.artifact-id }}
      plan-github-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .idp/engine
          persist-credentials: false
      - uses: ./.idp/engine/.github/actions/setup-idp # zizmor: ignore[self-repository] the engine is checked out at job.workflow_sha in the step above (ADR-0021)
        with:
          engine-dir: .idp/engine
          version: ${{ job.workflow_sha }}
      - name: check the repository configuration
        id: config
        env:
          READER_CLIENT_ID: ${{ vars.IDP_READER_CLIENT_ID }}
          READER_KEY_SET: ${{ secrets.IDP_READER_PRIVATE_KEY != '' }}
          PASSPHRASE_SET: ${{ secrets.IDP_STATE_PASSPHRASE != '' }}
        run: |
          missing=""
          [ -n "$READER_CLIENT_ID" ] || missing="$missing variable IDP_READER_CLIENT_ID,"
          [ "$READER_KEY_SET" = true ] || missing="$missing secret IDP_READER_PRIVATE_KEY,"
          [ "$PASSPHRASE_SET" = true ] || missing="$missing secret IDP_STATE_PASSPHRASE,"
          if [ -n "$missing" ]; then
            echo "::error::the claims repo is missing:${missing%,}. Re-run the bootstrap (docs/runbooks/bootstrap.md) and pass the secrets from the caller workflow."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wet
          path: .idp/wet
          persist-credentials: false
      - name: render the claims
        id: render
        run: idp render --out "$RUNNER_TEMP/idp/work/rendered"
      - name: diff against wet
        id: diff
        run: idp diff --new "$RUNNER_TEMP/idp/work/rendered" --wet .idp/wet/rendered
      - name: split the affected stacks
        id: stacks
        env:
          AFFECTED: ${{ steps.diff.outputs.affected }}
        run: idp stacks --affected "$AFFECTED" --wet .idp/wet/rendered
      - name: keep the AWS renders for plan-aws
        id: renders
        if: steps.stacks.outputs.aws != '[]'
        run: |
          mkdir -p "$RUNNER_TEMP/idp/renders/new" "$RUNNER_TEMP/idp/renders/wet"
          if [ -d "$RUNNER_TEMP/idp/work/rendered/aws" ]; then cp -R "$RUNNER_TEMP/idp/work/rendered/aws" "$RUNNER_TEMP/idp/renders/new/aws"; fi
          if [ -d .idp/wet/rendered/aws ]; then cp -R .idp/wet/rendered/aws "$RUNNER_TEMP/idp/renders/wet/aws"; fi
      - name: upload the AWS renders
        id: upload-renders
        if: steps.stacks.outputs.aws != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idp-renders
          path: ${{ runner.temp }}/idp/renders
          include-hidden-files: true
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: mint the reader token
        id: reader
        if: steps.stacks.outputs.github == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 # zizmor: ignore[github-app] the read-only reader App plans every managed repo (ADR-0023)
        with:
          client-id: ${{ vars.IDP_READER_CLIENT_ID }}
          private-key: ${{ secrets.IDP_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: export TF_ENCRYPTION
        id: encryption
        if: steps.stacks.outputs.github == 'true'
        env:
          IDP_STATE_PASSPHRASE: ${{ secrets.IDP_STATE_PASSPHRASE }}
        run: idp encryption-env
      - name: plan the github stack
        id: plan
        if: steps.stacks.outputs.github == 'true'
        working-directory: ${{ runner.temp }}/idp/work/rendered/github
        env:
          GITHUB_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/idp/work/tfstate" "$RUNNER_TEMP/idp/plans"
          if [ -f "$GITHUB_WORKSPACE/.idp/wet/tfstate/github.tfstate" ]; then
            cp "$GITHUB_WORKSPACE/.idp/wet/tfstate/github.tfstate" "$RUNNER_TEMP/idp/work/tfstate/github.tfstate"
          fi
          tofu init -input=false -lockfile=readonly
          tofu plan -input=false -lock=false -refresh=false -out="$RUNNER_TEMP/idp/plans/github.tfplan"
          tofu show -json "$RUNNER_TEMP/idp/plans/github.tfplan" > "$RUNNER_TEMP/idp/plans/github.json"
      - name: reduce the github plan
        id: reduce
        if: steps.stacks.outputs.github == 'true'
        run: idp plan-reduce --stack github --plan "$RUNNER_TEMP/idp/plans/github.json" --out-dir "$RUNNER_TEMP/idp/reduced"
      - name: upload the reduced github plan
        id: upload
        if: steps.stacks.outputs.github == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idp-plan-github
          path: ${{ runner.temp }}/idp/reduced/github.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  plan-aws:
    name: plan-aws ${{ matrix.stack }}
    needs: plan
    if: needs.plan.outputs.aws != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.aws) }}
    # floci reaches the Docker socket because its ECR runs a registry container
    # (ADR-0004), so this job holds no secret and saves no cache (ADR-0031).
    services:
      floci:
        image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
        ports:
          - "4566:4566"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .idp/engine
          persist-credentials: false
      - uses: ./.idp/engine/.github/actions/setup-idp # zizmor: ignore[self-repository] the engine is checked out at job.workflow_sha in the step above (ADR-0021)
        with:
          engine-dir: .idp/engine
          version: ${{ job.workflow_sha }}
      - name: wait until floci is ready
        id: floci-ready
        run: |
          until (( SECONDS >= 60 )); do
            if [[ "$(curl -fsS --max-time 2 http://localhost:4566/_floci/init 2>/dev/null)" == *'"ready":true'* ]]; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::floci did not report ready on localhost:4566 within 60 seconds"
          exit 1
      # By the ID the plan job outputs, never by name (ADR-0031). An empty
      # artifact-ids would download every artifact of the run, hence the guard.
      - name: fetch the AWS renders
        id: download
        if: needs.plan.outputs.renders-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.renders-id }}
          path: ${{ runner.temp }}/idp/renders
          merge-multiple: true
      - name: plan the stack against floci
        id: plan
        env:
          STACK: ${{ matrix.stack }}
          ACCOUNT: ${{ matrix.account }}
        run: |
          idp aws-stack plan --stack "$STACK" --account "$ACCOUNT" \
            --new "$RUNNER_TEMP/idp/renders/new" --wet "$RUNNER_TEMP/idp/renders/wet" \
            --work "$RUNNER_TEMP/idp/aws" --endpoint http://localhost:4566 --out-dir "$RUNNER_TEMP/idp/reduced"
      - name: upload the reduced plan
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idp-plan-${{ matrix.artifact }}
          path: ${{ runner.temp }}/idp/reduced/${{ matrix.artifact }}.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  comment:
    name: comment
    needs: [plan, plan-aws]
    if: "!cancelled() && needs.plan.result == 'success' && (needs.plan-aws.result == 'success' || needs.plan-aws.result == 'skipped')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .idp/engine
          persist-credentials: false
      - uses: ./.idp/engine/.github/actions/setup-idp # zizmor: ignore[self-repository] the engine is checked out at job.workflow_sha in the step above (ADR-0021)
        with:
          engine-dir: .idp/engine
          version: ${{ job.workflow_sha }}
      # The layout must not depend on how many artifacts a download resolves to:
      # download-artifact extracts into path itself when it resolves to one
      # artifact (a download by ID, or a pattern that matches one) and into
      # path/<name>/ otherwise. So the github plan, by ID, merges into
      # plans/idp-plan-github; the AWS plans, which floci jobs upload, go by a
      # pattern that cannot match idp-plan-github into aws-plans, a directory
      # apart from plans; and the layout step copies each plan the trusted matrix
      # names to plans/idp-plan-<A>/<A>.json, where idp plan-summary --plan-dir
      # reads it, taking only a regular file. A missing one stays missing and
      # plan-summary fails (ADR-0031). An empty artifact-ids would download every
      # artifact of the run, hence the guard.
      - name: fetch the reduced github plan
        id: download-github
        if: needs.plan.outputs.plan-github-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-github-id }}
          path: ${{ runner.temp }}/idp/plans/idp-plan-github
          merge-multiple: true
      - name: fetch the reduced AWS plans
        id: download-aws
        if: needs.plan.outputs.aws != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: idp-plan-aws.*
          path: ${{ runner.temp }}/idp/aws-plans
          merge-multiple: true
      - name: lay the AWS plans out where plan-summary reads them
        id: layout
        if: needs.plan.outputs.aws != '[]'
        env:
          AWS_STACKS: ${{ needs.plan.outputs.aws }}
        run: |
          while IFS= read -r artifact; do
            f="$RUNNER_TEMP/idp/aws-plans/$artifact.json"
            if [ -f "$f" ] && [ ! -L "$f" ]; then
              mkdir -p "$RUNNER_TEMP/idp/plans/idp-plan-$artifact"
              cp "$f" "$RUNNER_TEMP/idp/plans/idp-plan-$artifact/$artifact.json"
            fi
          done < <(jq -r '.[].artifact' <<<"$AWS_STACKS")
      - name: summarize the plans
        id: summary
        env:
          AFFECTED: ${{ needs.plan.outputs.affected }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/idp/out"
          idp plan-summary --stacks "$AFFECTED" --head-sha "$HEAD_SHA" --run-url "$RUN_URL" \
            --plan-dir "$RUNNER_TEMP/idp/plans" \
            --comment-out "$RUNNER_TEMP/idp/out/comment.md" \
            --fingerprint-out "$RUNNER_TEMP/idp/out/fingerprint.json"
      - name: post the sticky plan comment
        id: post
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: idp comment --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --body-file "$RUNNER_TEMP/idp/out/comment.md"

  verdict:
    name: verdict
    needs: [validate, plan, plan-aws, comment]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: decide
        id: decide
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          VALIDATE: ${{ needs.validate.result }}
          PLAN: ${{ needs.plan.result }}
          PLAN_AWS: ${{ needs.plan-aws.result }}
          COMMENT: ${{ needs.comment.result }}
        run: |
          if [ "$SAME_REPO" != true ]; then
            echo "::error::a maintainer must push this branch to the repo: pull requests from forks are validated but never planned"
            exit 1
          fi
          if [ "$VALIDATE" != success ] || [ "$PLAN" != success ] || [ "$COMMENT" != success ]; then
            echo "::error::the idp pipeline did not succeed (validate: $VALIDATE, plan: $PLAN, plan-aws: $PLAN_AWS, comment: $COMMENT)"
            exit 1
          fi
          if [ "$PLAN_AWS" != success ] && [ "$PLAN_AWS" != skipped ]; then
            echo "::error::an AWS stack's plan did not succeed (plan-aws: $PLAN_AWS)"
            exit 1
          fi
          echo "idp: validated, planned and commented"
