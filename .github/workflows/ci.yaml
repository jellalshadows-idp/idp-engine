name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  workflows:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: actionlint (claims repo templates)
        # concurrency.queue is a documented GitHub key (spec §6.2) that actionlint v1.7.12 does not know yet.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -ignore 'unexpected key "queue" for "concurrency" section' examples/claims-repo/.github/workflows/*.yaml
      - name: zizmor
        run: pipx run zizmor==1.31.1 .github/workflows .github/actions/setup-idp/action.yaml examples/claims-repo/.github/workflows/*.yaml
      - name: renovate config
        id: renovate-config
        # The Renovate image at renovate.yaml's version: Renovate needs a newer
        # Node than the runner's, and the run and the check stay one version.
        run: docker run --rm -v "$GITHUB_WORKSPACE/.github/renovate-global.json:/tmp/renovate-global.json:ro" ghcr.io/renovatebot/renovate:44.171.2 renovate-config-validator --strict /tmp/renovate-global.json

  modules:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [github/group, github/component]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: tofu fmt and test
        working-directory: modules/${{ matrix.module }}
        run: |
          tofu fmt -check -recursive
          cp "$GITHUB_WORKSPACE/lockfiles/github.terraform.lock.hcl" .terraform.lock.hcl
          tofu init -input=false -lockfile=readonly
          tofu test

  render-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: render the fixture with local module sources
        run: go run ./cmd/idp render --dir internal/render/testdata/basic --out "$RUNNER_TEMP/rendered" --modules-dir modules
      - name: tofu validate the rendered stack (proves the JSON syntax, lock file and modules)
        working-directory: ${{ runner.temp }}/rendered/github
        env:
          TF_ENCRYPTION: |
            key_provider "pbkdf2" "ci" {
              passphrase = "render-smoke-only-not-a-secret"
            }
            method "aes_gcm" "ci" {
              keys = key_provider.pbkdf2.ci
            }
            state {
              method = method.aes_gcm.ci
            }
            plan {
              method = method.aes_gcm.ci
            }
        run: |
          tofu init -backend=false -input=false
          tofu validate

  release-snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: goreleaser check
        id: check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check
      - name: goreleaser snapshot
        id: snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=publish
      - name: the snapshot binary reports a v-tag
        id: tag-check
        run: |
          archives=(dist/idp_*_linux_amd64.tar.gz)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "::error::want exactly one linux/amd64 archive in dist/, got ${archives[*]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/idp-check"
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/idp-check"
          got="$("$RUNNER_TEMP/idp-check/idp" version)"
          if ! [[ "$got" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the snapshot binary prints $got: the version ldflag must use {{.Tag}}, so rendered module sources keep the v (.goreleaser.yaml)"
            exit 1
          fi
          echo "snapshot idp version: $got"
