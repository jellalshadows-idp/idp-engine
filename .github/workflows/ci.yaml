name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  workflows:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: actionlint (claims repo templates)
        # concurrency.queue is a documented GitHub key (spec §6.2) that actionlint v1.7.12 does not know yet.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -ignore 'unexpected key "queue" for "concurrency" section' examples/claims-repo/.github/workflows/*.yaml
      - name: zizmor
        run: pipx run zizmor==1.32.0 .github/workflows .github/actions/setup-idp/action.yaml examples/claims-repo/.github/workflows/*.yaml
      - name: renovate config
        id: renovate-config
        # The Renovate image at renovate.yaml's version: Renovate needs a newer
        # Node than the runner's, and the run and the check stay one version.
        run: docker run --rm -v "$GITHUB_WORKSPACE/.github/renovate-global.json:/tmp/renovate-global.json:ro" ghcr.io/renovatebot/renovate:44.222.5 renovate-config-validator --strict /tmp/renovate-global.json

  modules:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [github/group, github/component, aws/baseline, aws/component]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: tofu fmt and test
        id: tofu-test
        working-directory: modules/${{ matrix.module }}
        # modules/<provider>/<name> takes the lock file lockfiles/<provider>.terraform.lock.hcl.
        env:
          MODULE: ${{ matrix.module }}
        run: |
          tofu fmt -check -recursive
          cp "$GITHUB_WORKSPACE/lockfiles/${MODULE%%/*}.terraform.lock.hcl" .terraform.lock.hcl
          tofu init -input=false -lockfile=readonly
          tofu test

  render-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: render each fixture with local module sources and tofu validate every stack (proves the JSON syntax, lock files and modules)
        id: render-validate
        # basic renders only the github stack; aws-registry adds each
        # environment's variables and the AWS stacks under aws/. Every directory
        # with a main.tf.json is a stack. -lockfile=readonly fails a stack whose
        # shipped lock file lacks its provider, and the plugin cache downloads
        # each provider once.
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
          TF_ENCRYPTION: |
            key_provider "pbkdf2" "ci" {
              passphrase = "render-smoke-only-not-a-secret"
            }
            method "aes_gcm" "ci" {
              keys = key_provider.pbkdf2.ci
            }
            state {
              method = method.aes_gcm.ci
            }
            plan {
              method = method.aes_gcm.ci
            }
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          shopt -s globstar
          for fixture in basic aws-registry; do
            go run ./cmd/idp render --dir "internal/render/testdata/$fixture" --out "$RUNNER_TEMP/rendered/$fixture" --modules-dir modules
            for stack in "$RUNNER_TEMP/rendered/$fixture"/**/main.tf.json; do
              stack="${stack%/main.tf.json}"
              tofu -chdir="$stack" init -backend=false -input=false -lockfile=readonly
              tofu -chdir="$stack" validate
            done
          done

  floci:
    # Level 3 (spec §8.4): the rendered AWS stacks of the aws-registry fixture
    # applied to two accounts of one floci, checked against internal/naming,
    # replayed and destroyed by internal/floci.
    # floci reaches the Docker socket because its ECR runs a registry container
    # (ADR-0004).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      floci:
        image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
        ports:
          - "4566:4566"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # floci holds the Docker socket, so this job saves no cache that other
          # jobs restore.
          cache: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: wait until floci is ready
        id: floci-ready
        # The same check as the image's health probe (docker/healthcheck.sh); it
        # fails, never continues, when floci does not answer. --max-time keeps a
        # floci that accepts but never answers within the 60 seconds.
        run: |
          until (( SECONDS >= 60 )); do
            if [[ "$(curl -fsS --max-time 2 http://localhost:4566/_floci/init 2>/dev/null)" == *'"ready":true'* ]]; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::floci did not report ready on localhost:4566 within 60 seconds"
          exit 1
      - name: apply, check, replay and destroy the rendered AWS stacks on floci
        id: floci-test
        env:
          IDP_FLOCI_ENDPOINT: http://localhost:4566
        run: go test -count=1 -timeout=15m -v ./internal/floci/
      - name: floci logs
        id: floci-logs
        # Also when the job times out, which ends it as cancelled.
        if: failure() || cancelled()
        env:
          FLOCI_CONTAINER: ${{ job.services.floci.id }}
        run: docker logs "$FLOCI_CONTAINER" 2>&1 | tail -n 300

  release-snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: goreleaser check
        id: check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: check
      - name: goreleaser snapshot
        id: snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean --skip=publish
      - name: the snapshot binary reports a v-tag
        id: tag-check
        run: |
          archives=(dist/idp_*_linux_amd64.tar.gz)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "::error::want exactly one linux/amd64 archive in dist/, got ${archives[*]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/idp-check"
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/idp-check"
          got="$("$RUNNER_TEMP/idp-check/idp" version)"
          if ! [[ "$got" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the snapshot binary prints $got: the version ldflag must use {{.Tag}}, so rendered module sources keep the v (.goreleaser.yaml)"
            exit 1
          fi
          echo "snapshot idp version: $got"
