name: idp-reconcile

# Claims repo caller of the engine's reconcile pipeline (docs/pipelines.md).
# A dispatch is the recovery button: it plans every stack against the current
# wet. Never re-run a reconcile run; dispatch a new one (ADR-0024).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: idp-wet
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    uses: jellalshadows-idp/idp-engine/.github/workflows/reconcile.yaml@150b7d35dc03831046d732a642e5ff03e33ce8bf # v0.1.1
    permissions:
      contents: read
      issues: write
      pull-requests: read
    secrets:
      IDP_STATE_PASSPHRASE: ${{ secrets.IDP_STATE_PASSPHRASE }}
      IDP_WRITER_PRIVATE_KEY: ${{ secrets.IDP_WRITER_PRIVATE_KEY }}
